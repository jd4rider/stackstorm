<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Stackstorm \u2014 stack neon tetraminos, slide them into place after they land, and break the storm. Play free in your browser."
    />
    <meta name="theme-color" content="#080b1a" />
    <meta property="og:title" content="Stackstorm" />
    <meta property="og:description" content="A neon falling-block puzzle game from Little Joy Arcade." />
    <meta property="og:type" content="website" />
    <title>Stackstorm \u2014 Little Joy Arcade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #080b1a;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Stackstorm game canvas" role="application"></main>
    <p id="game-status" class="sr-only" aria-live="polite"></p>
    <noscript>Stackstorm needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
    <script src="./arcade-client.js" data-game-id="stackstorm"></script>
  </body>
</html>
